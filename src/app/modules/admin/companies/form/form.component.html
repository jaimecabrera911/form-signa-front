<app-content class="w-full" [title]="title" [subtitle]="subtitle">
    <div *appPanels class="w-full">
        <form [formGroup]="formInit">
            <div class="flex flex-col flex-auto mt-2">
                <div class="flex flex-col px-8 my-6 rounded">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-2 gap-x-9 w-full">
                        <app-input-text label="{{ filterParamLabel('nitCompany') }}" formControlName="identificationNumber" [required]="formInit.controls['identificationNumber'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('identificationNumber')?.disabled"></app-input-text>
                        <app-input-text label="{{ filterParamLabel('companyName') }}" formControlName="name" [required]="formInit.controls['name'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('name')?.disabled"></app-input-text>
                        <app-input-text label="{{ filterParamLabel('legalRepresentative') }}" formControlName="legalRepresentative" [required]="formInit.controls['legalRepresentative'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('legalRepresentative')?.disabled"></app-input-text>
                        <app-input-select label="{{ filterParamLabel('regime') }}" [options]="elementsRegimes" formControlName="regime" [required]="formInit.controls['regime'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('regime')?.disabled"></app-input-select>
                        <app-input-select label="{{ filterParamLabel('city') }}" [options]="elementsCities" formControlName="city" [required]="formInit.controls['city'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('city')?.disabled"></app-input-select>
                        <app-input-text label="{{ filterParamLabel('address') }}" formControlName="address" [required]="formInit.controls['address'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('address')?.disabled"></app-input-text>
                        <app-input-text label="{{ filterParamLabel('phone') }}" formControlName="phone" [required]="formInit.controls['phone'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('phone')?.disabled"></app-input-text>
                        <app-input-text label="{{ filterParamLabel('email') }}" formControlName="email" [required]="formInit.controls['email'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('email')?.disabled"></app-input-text>
                        <app-input-text label="{{ filterParamLabel('webSite') }}" formControlName="webSite" [required]="formInit.controls['webSite'].hasError('required')" [validateFormSumt]="validate" [disabled]="formInit.get('webSite')?.disabled"></app-input-text>
                    </div>
                </div>
            </div>
            <div *ngIf="modView" class="pl-10">
                <div class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-4 lg:grid-cols-4 gap-4 w-full">
                    <div class="flex flex-col flex-auto">
                        <a class="mt-1 pl-2 px-12 text-center  w-32" mat-button mat-flat-button [color]="'primary'" (click)="onSubmit()">
                            <span class="ml-7">{{ filterParamLabel('save') }}</span>
                        </a>
                    </div>
                    <div class="flex flex-col flex-auto">
                        <a class="mt-1 pl-2 px-12 text-center  w-32" mat-button mat-flat-button (click)="formInit.reset()">
                            <span class="ml-7">{{ filterParamLabel('cancel') }}</span>
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</app-content>
